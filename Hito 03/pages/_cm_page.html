<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkStation espacios de trabajo</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/script.js" defer></script>
</head>

<body>

    <header>
        <img src="../img/ws_logo_nobg.png" alt="Logo WorkStation" style="width: 40%;">
    </header>


    <nav id="navPrincipal"></nav>
    
    <h1>Página del Community Manager</h1>

    <main>

        <section>

            <article>

                <h3>Espacios</h3>


                <table>

                    <thead>
                        <tr>
                            <th>Espacio</th>
                            <th>Estado</th>
                        </tr>
                    </thead>

                    <tbody id="espacios"></tbody>

                </table>

            </article>

            <article>

                <h3>Reservas</h3>


                <table>

                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Espacio</th>
                            <th>Estado</th>
                        </tr>
                    </thead>

                    <tbody id="reservas"></tbody>

                </table>

            </article>

        </section>

    </main>

    <footer>

        <p>
            © 2026 WorkStation | Espacios de trabajo y creación
        </p>

    </footer>

</body>

</html>
