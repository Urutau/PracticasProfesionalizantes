<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkStation espacios de trabajo</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/script.js" defer></script>
</head>

<body>

    <header>
        <img src="../img/ws_logo_nobg.png" alt="Logo WorkStation" style="width: 40%;">
    </header>

    <nav id="navPrincipal"></nav>


    <main>

        <section>
            <article>
                <h3>Iniciar sesión</h3>

                <p>
                    Ingresá con tus datos
                </p>

                <form id="formLogIn">

                    <div>
                        <br>
                        <label for="liemail">Correo Electrónico</label>
                        <br>
                        <input type="email" id="liemail" placeholder="Ingresá tu e-mail">
                    </div>

                    <div>
                        <br>
                        <label for="lipassword">Contraseña</label>
                        <br>
                        <input type="password" id="lipassword" placeholder="********">
                    </div>

                    <button>Enviar consulta</button>
                </form>
            </article>
        </section>
    </main>
