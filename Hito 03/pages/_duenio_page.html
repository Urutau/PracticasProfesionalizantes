<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkStation espacios de trabajo</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/script.js" defer></script>
</head>
<body>
    
    <header>
        <img src="../img/ws_logo_nobg.png" alt="Logo WorkStation" style="width: 40%;">
    </header>

    
    <nav id="navPrincipal"></nav>
        
    <h1>Página del Dueño</h1>
    
    <main>
        
        <section>
                        
            <article>
                
                <h3>Membresías</h3>
                                
                    <table>
                        
                        <thead>
                            <tr>
                                <th>Membresía</th>
                                <th>Créditos utilizados este mes</th>
                            </tr>
                        </thead>

                        <tbody id="membresias">
                            <tr>
                                <td>Impulso</td>
                                <td>40%</td>
                            </tr>
                            <tr>
                                <td>Conexión</td>
                                <td>80%</td>
                            </tr>
                            <tr>
                                <td>Crecimiento</td>
                                <td>65%</td>
                            </tr>
                            <tr>
                                <td>Identidad</td>
                                <td>45%</td>
                            </tr>
                        </tbody>

                </table>

             </article>
            
            <article>
                
                <h3>Horarios</h3>
                                

                    <table>
                        
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Hora</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>#01</td>
                                <td>08:00</td>
                            </tr>
                            <tr>
                                <td>#02</td>
                                <td>09:00</td>
                            </tr>
                            <tr>
                                <td>#03</td>
                                <td>10:00</td>
                            </tr>
                        </tbody>

                </table>
                
             </article>
    
        </section>
    
    </main>
    
    <footer>
    
        <p>
            © 2026 WorkStation | Espacios de trabajo y creación
        </p>
    
    </footer>
    
</body>
</html>
