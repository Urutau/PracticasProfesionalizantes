name: Deploy Hito 02 to Pages

on:
  push:
    branches: ["main"] # Cambia a "master" si tu rama principal se llama así

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Aquí indicamos la carpeta exacta. Las comillas manejan el espacio en el nombre.
          path: './Hito 02'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
