<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkStation espacios de trabajo</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/script.js" defer></script>
</head>

<body>

    <header>
        <img src="../img/ws_logo_nobg.png" alt="Logo WorkStation" style="width: 40%;">
    </header>

    <nav id="navPrincipal"></nav>


    <main>

        <section>
            <article>
                <h3>Iniciar sesión</h3>

                <p>
                    Ingresá con tus datos
                </p>

                <form id="formLogIn" class="form-login">

                    <div class="campo-login">
                        <label for="liemail">Correo electrónico:</label>
                        <input type="email" id="liemail"
                            placeholder="Ingresá tu e-mail" required>
                    </div>

                    <div class="campo-login">
                        <label for="lipassword">Contraseña:</label>
                        <input type="password" id="lipassword"
                            placeholder="Ingresá tu contraseña" required>
                    </div>

                    <button type="submit">Iniciar sesión</button>

                </form>

            </article>
        </section>
    </main>
    <footer>
        <p>WorkStation - Espacios de trabajo</p>
    </footer>

</body>
</html>
