<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkStation espacios de trabajo</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/script.js" defer></script>
</head>
<body>
    
    <header>
        <img src="../img/ws_logo_nobg.png" alt="Logo WorkStation" style="width: 40%;">
    </header>

    <nav id="navPrincipal"></nav>
    
    <main>
    
        <section>

			<article>

				<h3>Historial de reservas</h3>

				<h4>Nueva reserva</h4>

				<form id="formReserva" class="form-reserva">

					<div class="campo-reserva">
						<label for="fecha">Fecha:</label>
						<input type="date" id="fecha" required>
					</div>

					<div class="campo-reserva">
						<label for="hora">Hora:</label>
						<input type="time" id="hora" required>
					</div>

					<div class="campo-reserva campo-completo">
						<label for="espacio">Espacio:</label>
						<select id="espacio" required>
							<option value="">Seleccionar espacio</option>
							<option value="01">Sala Mayor</option>
							<option value="02">Sala</option>
							<option value="03">Escritorio</option>
						</select>
					</div>

					<div class="campo-reserva">
						<label for="duracion">Duración (horas):</label>
						<input type="number" id="duracion" min="1" required>
					</div>

					<div class="campo-reserva">
						<label for="invitados">Cantidad de invitados:</label>
						<input type="number" id="invitados" min="0" value="0">
					</div>

					<button type="submit">Reservar</button>

				</form>

				<h4>Mis reservas</h4>

				<table>
					<thead>
						<tr>
							<th>Fecha</th>
							<th>Hora</th>
							<th>Espacio</th>
							<th>Estado</th>
						</tr>
					</thead>
					<tbody id="misReservas"></tbody>
				</table>

			</article>
