<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkStation espacios de trabajo</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/script.js" defer></script>
</head>
<body>
    
    <header>
        <img src="../img/ws_logo_nobg.png" alt="Logo WorkStation" style="width: 40%;">
    </header>

    <nav id="navPrincipal"></nav>
    
<main>
    <section>
        <article>
            <h3>Contacto</h3>

            <p>Por favor, dejanos tu mensaje.</p>

            <form action="mensaje-enviado.html" class="form-contacto">

                <div class="campo-contacto">
                    <label for="nombre">Nombre y Apellido:</label>
                    <input type="text" id="nombre" placeholder="Tu nombre" required>
                </div>

                <div class="campo-contacto">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="campo-contacto campo-completo">
                    <label for="asunto">Asunto:</label>
                    <select id="asunto" required>
                        <option value="">Seleccionar asunto</option>
                        <option>Consulta general</option>
                        <option>Información de membresías</option>
                        <option>Reserva de espacios</option>
                        <option>Otro</option>
                    </select>
                </div>

                <div class="campo-contacto campo-completo">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" placeholder="Escribí tu mensaje aquí..." required></textarea>
                </div>

                <button type="submit">Enviar consulta</button>

            </form>
        </article>
    </section>
</main>


<footer>
    <p>
        © 2026 WorkStation | Espacios de trabajo y creación
    </p>
</footer>

</body>
</html>
