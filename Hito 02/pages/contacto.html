<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkStation espacios de trabajo</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    
    <header>
        <img src="../img/ws_logo_nobg.png" alt="Logo WorkStation" style="width: 50%;">
    </header>

    <nav>
        <ul>
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="membresias.html">Membresías</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li><a href="historial.html">Historial</a></li>            
            <li><a href="inicio_sesion.html">Iniciar sesión</a></li>
        </ul>

   <main>
    
        <section>
            <article>
                <h3>Contacto</h3>
    
                <p>
                    Por favor, dejanos tu mensaje.
                </p>
                <form>
                    <div>
                        <label for="nombre">Nombre y Apellido</label>
                        <input type="text" id="nombre" placeholder="Tu nombre">
                    </div>
                    <div>
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" placeholder="ejemplo@correo.com">
                    </div>
                    <div>
                        <label for="asunto">Asunto</label>
                        <select id="asunto">
                            <option>Consulta general</option>
                            <option>Información de membresías</option>
                            <option>Reserva de espacios</option>
                            <option>Otro</option>
                        </select>
                    </div>
                    <div>
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" placeholder="Escribí tu mensaje aquí..."></textarea>
                    </div>
                </form>
                <button type="submit">Enviar consulta</button>
            </article>    
    
        </section>
    
    </main>
