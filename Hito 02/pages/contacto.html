<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkStation espacios de trabajo</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    
    <header>
        <img src="../img/ws_logo_nobg.png" alt="Logo WorkStation" style="width: 50%;">
    </header>

    <nav>
        <ul>
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="membresias.html">Membresías</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li><a href="historial.html">Historial</a></li>            
            <li><a href="espacios.html">Espacios</a></li>
        </ul>
    </nav>

    
    <main>
    
        <section>
    
                 <h3>Reservá espacios</h3>
    
                <p>
                    Por favor, dejanos tu mensaje.
                </p>
                <form>
                    <div>
                        <div>
                            <label for="espacio">Espacio</label>
                            <select id="espacio">
                                <option>Sala Grande</option>
                                <option>Sala Media</option>
                                <option>Sala Petit</option>
                                <option>Auditorio</option>
                                <option>Escritorio</option>
                            </select>
                        </div>
                        <label for="fecha">Fecha</label>
                        <textarea id="fecha"></textarea>
                    </div>
                    <div>
                        <label for="hora">Hora de ingreso</label>
                        <textarea id="hora"></textarea>
                    </div>
                    <div>
                        <label for="duracion">Duración</label>
                        <select id="duracion">
                            <option>Una hora</option>
                            <option>Hora y media</option>
                            <option>Dos horas</option>
                            <option>Dos horas y media</option>
                        </select>
                    </div>
                </form>
                <button>Comprobar disponibilidad</button>
            </article>    
    
        </section>
    
    </main>
    
    <footer>
    
        <p>
            © 2026 WorkStation | Espacios de trabajo y creación
        </p>
    
    </footer>
    
</body>
</html>
